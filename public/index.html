<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#sky {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: block;
}

.vignette {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 42%,
    rgba(0,0,0,0) 28%, rgba(0,0,0,.78) 100%);
}

.center {
  position: fixed;
  inset: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}

.title {
  font-family: 'Great Vibes', cursive;
  font-weight: 400;
  font-size: clamp(3.5rem, 12vw, 7rem);
  line-height: 1;
  background-image: linear-gradient(100deg,
    #ffffff 0%, #ffffff 30%, #d8d8d8 46%,
    #a8a8a8 58%, #e6e6e6 70%, #ffffff 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: sheen 9s ease-in-out infinite;
  filter:
    drop-shadow(0 0 6px rgba(255,255,255,.4))
    drop-shadow(0 0 18px rgba(255,255,255,.2));
}

@keyframes sheen {
  0%   { background-position:   0% 50%; }
  50%  { background-position: 125% 50%; }
  100% { background-position: 250% 50%; }
}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="vignette"></div>

<div class="center">
  <h1 class="title">prisim</h1>
</div>

<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, stars = [], shooters = [], nextSpawn = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildStars();
}

function buildStars(){
  const target = Math.min(Math.round((W * H) / 9000), 260);
  stars = Array.from({ length: target }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.05 + 0.25,
    base: Math.random() * 0.42 + 0.12,
    amp: Math.random() * 0.36,
    phase: Math.random() * Math.PI * 2,
    spd: 0.5 + Math.random() * 1.7,
  }));
}

function spawnShooter(){
  const dir = Math.random() < 0.5 ? 1 : -1;
  const angle = (16 + Math.random() * 32) * Math.PI / 180;
  const speed = 7 + Math.random() * 9;
  const vx = Math.cos(angle) * speed * dir;
  const vy = Math.sin(angle) * speed;
  const startY = -60 + Math.random() * H * 0.6;
  const startX = dir === 1 ? -140 - Math.random() * 260 : W + 140 + Math.random() * 260;
  shooters.push({
    x: startX, y: startY, vx, vy,
    len: 130 + Math.random() * 260,
    width: 0.8 + Math.random() * 1.5,
    life: 0,
    maxLife: 80 + Math.random() * 80,
  });
}

function drawShooter(s){
  const mag = Math.hypot(s.vx, s.vy) || 1;
  const ux = s.vx / mag, uy = s.vy / mag;
  const tailX = s.x - ux * s.len;
  const tailY = s.y - uy * s.len;
  const p = s.life / s.maxLife;
  const alpha = Math.max(0, Math.min(1, p / 0.10) * Math.min(1, (1 - p) / 0.40));
  if(alpha <= 0) return;
  const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
  grad.addColorStop(0.00, `rgba(255,255,255,${0.9 * alpha})`);
  grad.addColorStop(0.25, `rgba(230,230,230,${0.35 * alpha})`);
  grad.addColorStop(0.6, `rgba(180,180,180,${0.08 * alpha})`);
  grad.addColorStop(1.00, 'rgba(150,150,150,0)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = s.width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(s.x, s.y);
  ctx.lineTo(tailX, tailY);
  ctx.stroke();
  const headR = s.width * 7;
  const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, headR);
  glow.addColorStop(0.00, `rgba(255,255,255,${0.9 * alpha})`);
  glow.addColorStop(0.4, `rgba(220,220,220,${0.25 * alpha})`);
  glow.addColorStop(1.00, 'rgba(180,180,180,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(s.x, s.y, headR, 0, Math.PI * 2);
  ctx.fill();
}

function loop(now){
  ctx.clearRect(0, 0, W, H);
  const t = now * 0.001;
  for(const st of stars){
    const a = st.base + st.amp * Math.sin(t * st.spd + st.phase);
    if(a <= 0) continue;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
  }
  if(now >= nextSpawn){
    spawnShooter();
    if(Math.random() < 0.3) spawnShooter();
    nextSpawn = now + 380 + Math.random() * 1000;
  }
  for(let i = shooters.length - 1; i >= 0; i--){
    const s = shooters[i];
    drawShooter(s);
    s.x += s.vx; s.y += s.vy; s.life++;
    if(s.life > s.maxLife || s.x < -520 || s.x > W + 520 || s.y > H + 520){
      shooters.splice(i, 1);
    }
  }
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>

</body>
</html>
