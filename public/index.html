<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Nametag System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #0f0f0f 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(28, 28, 28, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 45, 45, 0.5);
        }
        
        .glow-purple {
            box-shadow: 0 0 20px rgba(110, 0, 100, 0.3);
        }
        
        .user-card {
            transition: all 0.3s ease;
        }
        
        .user-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(110, 0, 100, 0.2);
        }
        
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading-spinner {
            border: 3px solid rgba(110, 0, 100, 0.3);
            border-top: 3px solid #6e0064;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                Prism Nametag System
            </h1>
            <p class="text-gray-400">Real-time user tracking and server information</p>
        </div>
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="glass-card rounded-xl p-4 glow-purple">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm">Total Users</p>
                        <p id="totalUsers" class="text-2xl font-bold text-purple-400">-</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-purple-500/20 flex items-center justify-center">
                        <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-xl p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm">Last Updated</p>
                        <p id="lastUpdated" class="text-lg font-semibold text-blue-400">-</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-xl p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-400 text-sm">Status</p>
                        <p id="systemStatus" class="text-lg font-semibold text-green-400">Connected</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center">
                        <div class="w-3 h-3 rounded-full bg-green-400 pulse-dot"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="glass-card rounded-xl p-4 mb-8">
            <div class="flex flex-wrap gap-4 items-center justify-between">
                <div class="flex gap-2">
                    <button onclick="refreshData()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        Refresh
                    </button>
                    <button onclick="toggleAutoRefresh()" id="autoRefreshBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Auto Refresh: Off
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <input type="text" id="searchInput" placeholder="Search users..." 
                           class="px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-purple-500 text-sm"
                           oninput="filterUsers()">
                </div>
            </div>
        </div>
        
        <!-- Loading State -->
        <div id="loadingState" class="flex justify-center items-center py-12">
            <div class="loading-spinner"></div>
        </div>
        
        <!-- Users Grid -->
        <div id="usersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden">
            <!-- User cards will be dynamically inserted here -->
        </div>
        
        <!-- Empty State -->
        <div id="emptyState" class="glass-card rounded-xl p-12 text-center hidden">
            <svg class="w-16 h-16 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <h3 class="text-xl font-semibold text-gray-400 mb-2">No Users Found</h3>
            <p class="text-gray-500">Users will appear here when they run the Prism script</p>
        </div>
        
        <!-- Debug Console -->
        <div class="glass-card rounded-xl p-4 mt-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-purple-400">Debug Console</h3>
                <button onclick="clearDebugLog()" class="text-sm text-gray-400 hover:text-white transition-colors">Clear</button>
            </div>
            <div id="debugConsole" class="bg-gray-900 rounded-lg p-4 h-48 overflow-y-auto font-mono text-sm">
                <p class="text-gray-500">Debug logs will appear here...</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = '/api/nametags';
        const HEALTH_URL = '/api/health';
        let autoRefreshInterval = null;
        let allUsers = [];
        
        // Debug logging
        function debugLog(message, type = 'info') {
            const console = document.getElementById('debugConsole');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: 'text-blue-400',
                success: 'text-green-400',
                error: 'text-red-400',
                warning: 'text-yellow-400'
            };
            
            const logEntry = document.createElement('p');
            logEntry.className = colors[type] || 'text-gray-400';
            logEntry.textContent = `[${timestamp}] ${message}`;
            
            // Remove initial message if present
            if (console.querySelector('.text-gray-500')) {
                console.innerHTML = '';
            }
            
            console.appendChild(logEntry);
            console.scrollTop = console.scrollHeight;
        }
        
        function clearDebugLog() {
            const console = document.getElementById('debugConsole');
            console.innerHTML = '<p class="text-gray-500">Debug logs will appear here...</p>';
        }
        
        // Fetch nametag data
        async function fetchNametagData() {
            debugLog('Fetching nametag data from API...', 'info');
            
            try {
                const response = await fetch(API_URL);
                const responseText = await response.text();
                
                debugLog(`Response status: ${response.status}`, 'info');
                debugLog(`Response text: ${responseText.substring(0, 200)}...`, 'info');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${responseText}`);
                }
                
                const data = JSON.parse(responseText);
                
                if (data.success) {
                    debugLog(`Successfully fetched ${data.data.users?.length || 0} users`, 'success');
                    allUsers = data.data.users || [];
                    updateUI(data.data);
                } else {
                    debugLog(`API Error: ${data.error}`, 'error');
                }
            } catch (error) {
                debugLog(`Fetch Error: ${error.message}`, 'error');
                document.getElementById('systemStatus').textContent = 'Disconnected';
                document.getElementById('systemStatus').className = 'text-lg font-semibold text-red-400';
            }
        }
        
        // Update UI with data
        function updateUI(data) {
            const users = data.users || [];
            
            // Update stats
            document.getElementById('totalUsers').textContent = users.length;
            
            if (data.lastUpdated) {
                const lastUpdate = new Date(data.lastUpdated);
                document.getElementById('lastUpdated').textContent = lastUpdate.toLocaleTimeString();
            }
            
            document.getElementById('systemStatus').textContent = 'Connected';
            document.getElementById('systemStatus').className = 'text-lg font-semibold text-green-400';
            
            // Hide loading, show appropriate state
            document.getElementById('loadingState').classList.add('hidden');
            
            if (users.length === 0) {
                document.getElementById('usersGrid').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('usersGrid').classList.remove('hidden');
                renderUsers(users);
            }
        }
        
        // Render user cards
        function renderUsers(users) {
            const grid = document.getElementById('usersGrid');
            grid.innerHTML = '';
            
            users.forEach(user => {
                const card = document.createElement('div');
                card.className = 'glass-card user-card rounded-xl p-4';
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-lg font-bold">
                                ${user.displayName?.charAt(0).toUpperCase() || '?'}
                            </div>
                            <div>
                                <h3 class="font-semibold text-white">${escapeHtml(user.displayName || user.username)}</h3>
                                <p class="text-sm text-gray-400">@${escapeHtml(user.username)}</p>
                            </div>
                        </div>
                        <div class="w-2 h-2 rounded-full bg-green-400 pulse-dot"></div>
                    </div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500">User ID:</span>
                            <span class="text-gray-300 font-mono">${user.userId}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Last Seen:</span>
                            <span class="text-gray-300">${user.lastSeen ? new Date(user.lastSeen).toLocaleString() : 'N/A'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        // Filter users based on search
        function filterUsers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(user => 
                user.username?.toLowerCase().includes(searchTerm) ||
                user.displayName?.toLowerCase().includes(searchTerm) ||
                user.userId?.toString().includes(searchTerm)
            );
            renderUsers(filtered);
        }
        
        // Refresh data
        function refreshData() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('usersGrid').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            fetchNametagData();
        }
        
        // Toggle auto refresh
        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Auto Refresh: Off
                `;
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                btn.classList.add('bg-gray-700', 'hover:bg-gray-600');
                debugLog('Auto-refresh disabled', 'warning');
            } else {
                autoRefreshInterval = setInterval(fetchNametagData, 5000);
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Auto Refresh: On
                `;
                btn.classList.remove('bg-gray-700', 'hover:bg-gray-600');
                btn.classList.add('bg-green-600', 'hover:bg-green-700');
                debugLog('Auto-refresh enabled (5s interval)', 'success');
            }
        }
        
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Check API health first
        async function checkHealth() {
            debugLog('Checking API health...', 'info');
            try {
                const response = await fetch(HEALTH_URL);
                const data = await response.json();
                debugLog(`Health check: ${data.message}`, data.success ? 'success' : 'error');
                return data.success;
            } catch (error) {
                debugLog(`Health check failed: ${error.message}`, 'error');
                return false;
            }
        }
        
        // Initial load
        checkHealth().then(isHealthy => {
            if (isHealthy) {
                fetchNametagData();
            } else {
                debugLog('API health check failed, please check deployment', 'error');
                document.getElementById('systemStatus').textContent = 'API Error';
                document.getElementById('systemStatus').className = 'text-lg font-semibold text-red-400';
            }
        });
    </script>
</body>
</html>
