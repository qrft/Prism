<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Nametags</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            min-height: 100vh;
            color: #e6e6e6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #b4b4b4, #e6e6e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #5a5a5a;
            font-size: 1rem;
        }

        .form-card {
            background: rgba(28, 28, 28, 0.8);
            border: 1px solid rgba(45, 45, 45, 0.6);
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            color: #5a5a5a;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            background: rgba(20, 20, 26, 0.8);
            border: 1px solid rgba(45, 45, 45, 0.5);
            border-radius: 8px;
            padding: 12px 16px;
            color: #e6e6e6;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: rgba(180, 180, 180, 0.5);
            box-shadow: 0 0 0 3px rgba(180, 180, 180, 0.1);
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2a2a2a, #3a3a3a);
            color: #e6e6e6;
            border: 1px solid rgba(45, 45, 45, 0.5);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3a3a3a, #4a4a4a);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(20, 20, 26, 0.8);
            color: #e6e6e6;
            border: 1px solid rgba(45, 45, 45, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(30, 30, 36, 0.8);
        }

        .btn-danger {
            background: rgba(170, 70, 70, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(170, 70, 70, 0.4);
        }

        .btn-danger:hover {
            background: rgba(170, 70, 70, 0.3);
        }

        .nametags-list {
            display: grid;
            gap: 15px;
        }

        .nametag-card {
            background: rgba(28, 28, 28, 0.6);
            border: 1px solid rgba(45, 45, 45, 0.4);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .nametag-card:hover {
            background: rgba(28, 28, 28, 0.8);
            border-color: rgba(45, 45, 45, 0.6);
        }

        .nametag-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .color-preview {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid (45, 45, 45, 0.5);
        }

        .nametag-details {
            flex: 1;
        }

        .player-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .tag-text {
            color: #5a5a5a;
            font-size: 0.9rem;
        }

        .nametag-actions {
            display: flex;
            gap: 10px;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #323232;
            border-radius: 24px;
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #ebebeb;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .slider {
            background-color: #505050;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #5a5a5a;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #5a5a5a;
        }

        .error {
            background: rgba(170, 70, 70, 0.2);
            border: 1px solid rgba(170, 70, 70, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .nametag-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .nametag-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Prism Nametags</h1>
            <p class="subtitle">Manage your player nametags</p>
        </header>

        <div id="error-container"></div>

        <div class="form-card">
            <form id="nametag-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="playerName">Player Name</label>
                        <input type="text" id="playerName" placeholder="Enter player name..." required>
                    </div>
                    <div class="form-group">
                        <label for="tagText">Tag Text</label>
                        <input type="text" id="tagText" placeholder="Enter tag text..." required>
                    </div>
                    <div class="form-group">
                        <label for="color">Color</label>
                        <input type="color" id="color" value="#ffffff">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Add Nametag</button>
            </form>
        </div>

        <div id="nametags-container">
            <div class="loading">Loading nametags...</div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/nametags';
        let nametags = [];

        async function fetchNametags() {
            try {
                const response = await fetch(API_BASE);
                if (!response.ok) throw new Error('Failed to fetch nametags');
                nametags = await response.json();
                renderNametags();
            } catch (error) {
                showError('Failed to load nametags. Please refresh the page.');
            }
        }

        async function createNametag(playerName, tagText, color) {
            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerName, tagText, color })
                });
                if (!response.ok) throw new Error('Failed to create nametag');
                const newNametag = await response.json();
                nametags.push(newNametag);
                renderNametags();
            } catch (error) {
                showError('Failed to add nametag. Please try again.');
            }
        }

        async function updateNametag(id, updates) {
            try {
                const response = await fetch(`${API_BASE}?id=${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });
                if (!response.ok) throw new Error('Failed to update nametag');
                const updated = await response.json();
                const index = nametags.findIndex(n => n.id === id);
                if (index !== -1) nametags[index] = updated;
                renderNametags();
            } catch (error) {
                showError('Failed to update nametag. Please try again.');
            }
        }

        async function deleteNametag(id) {
            try {
                const response = await fetch(`${API_BASE}?id=${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Failed to delete nametag');
                nametags = nametags.filter(n => n.id !== id);
                renderNametags();
            } catch (error) {
                showError('Failed to delete nametag. Please try again.');
            }
        }

        function renderNametags() {
            const container = document.getElementById('nametags-container');
            
            if (nametags.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                        <p>No nametags yet. Add your first one above!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="nametags-list">
                    ${nametags.map(nametag => `
                        <div class="nametag-card">
                            <div class="nametag-info">
                                <div class="color-preview" style="background-color: ${nametag.color}"></div>
                                <div class="nametag-details">
                                    <div class="player-name">${escapeHtml(nametag.playerName)}</div>
                                    <div class="tag-text">${escapeHtml(nametag.tagText)}</div>
                                </div>
                            </div>
                            <div class="nametag-actions">
                                <div class="toggle-switch">
                                    <label class="switch">
                                        <input type="checkbox" ${nametag.enabled ? 'checked' : ''} onchange="toggleEnabled('${nametag.id}')">
                                        <span class="slider"></span>
                                    </label>
                                </div>
                                <button class="btn btn-danger" onclick="deleteNametag('${nametag.id}')">Delete</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function toggleEnabled(id) {
            const nametag = nametags.find(n => n.id === id);
            if (nametag) {
                updateNametag(id, { enabled: !nametag.enabled });
            }
        }

        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('nametag-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const playerName = document.getElementById('playerName').value.trim();
            const tagText = document.getElementById('tagText').value.trim();
            const color = document.getElementById('color').value;
            
            if (playerName && tagText) {
                await createNametag(playerName, tagText, color);
                document.getElementById('nametag-form').reset();
                document.getElementById('color').value = '#ffffff';
            }
        });

        // Load nametags on page load
        fetchNametags();
    </script>
</body>
</html>
